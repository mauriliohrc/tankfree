name: CI
on:
  push:
  pull_request:
jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crypto unit tests (no hardware, no proprietary data)
        run: python3 installer/tests/test_cipher.py

  firmware-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run the DSP block-engine host test
        run: |
          cc -Ifirmware/src -O2 -Wall firmware/test/host_test.c \
             firmware/src/registry.c firmware/src/chain.c \
             firmware/src/blocks/eq_param.c firmware/src/blocks/delay_digital.c \
             firmware/src/blocks/drive_soft.c -lm -o /tmp/host_test
          /tmp/host_test
