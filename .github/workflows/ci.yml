name: CI
on:
  push:
  pull_request:
jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crypto unit tests (no hardware, no proprietary data)
        run: python3 installer/tests/test_cipher.py
