name: CI
on:
  push:
  pull_request:
jobs:
  crypto-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run crypto unit tests (no hardware, no proprietary data)
        run: python3 installer/tests/test_cipher.py

  firmware-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & run the DSP block-engine host test
        run: |
          BLOCKS="firmware/src/registry.c firmware/src/chain.c firmware/src/blocks/eq_param.c firmware/src/blocks/delay_digital.c firmware/src/blocks/drive_soft.c"
          cc -Ifirmware/src -O2 -Wall firmware/test/host_test.c $BLOCKS -lm -o /tmp/host_test
          /tmp/host_test
          cc -Ifirmware/src -O2 -Wall firmware/test/proto_test.c firmware/src/proto.c $BLOCKS -lm -o /tmp/proto_test
          /tmp/proto_test
          cc -Ifirmware/src -O2 firmware/test/midi_mvave_test.c firmware/src/midi_mvave.c -o /tmp/midi_test
          /tmp/midi_test
          cc -Ifirmware/src -O2 firmware/test/alpha_test.c firmware/src/app_alpha.c firmware/src/engine/ir.c firmware/src/engine/a2l.c -lm -o /tmp/alpha_test
          /tmp/alpha_test
      - name: Cross-compile firmware for pi32v2 (AC791N)
        run: bash firmware/build/compile_check.sh
